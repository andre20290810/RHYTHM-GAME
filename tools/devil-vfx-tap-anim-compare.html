<!doctype html>
<!--
  DEV-ONLY prototype. Not wired into index.html/main.js/renderer.js -
  production still uses the static assets/notes/devil-in-the-fire-tap.png
  exactly as shipped. Nothing here is committed/pushed until approved.

  Compares the CURRENT production static TAP (LEFT) against a looping
  sprite-sheet animation of the SAME asset (RIGHT) - same 82px display
  width, same lanes/judge line/background, same real chart timings. The
  animated sheet (tools/devil-vfx-assets/tap-anim-sheet.png, 8 frames of
  349x340 each) was generated by modulating ONLY brightness/color of the
  production tap.png's own pixels (white-hot core pulse, electric-arc
  brightness redistribution via smooth integer-harmonic noise, faint
  existing halo/ember pixels flaring up and dying down) - never a
  silhouette redraw, never a geometric warp, and the alpha channel plus
  every pixel within a 20px radius of the measured judge-tip
  (169.5, 326 in the source asset's own space) is byte-identical across
  all 8 frames (verified in the generation script). Frame selection here
  is plain drawImage of the correct sub-rectangle - no compositeGlow/
  destination-in/source-atop tricks - so the background-rectangle bug
  from an earlier round cannot recur.
-->
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>DEVIL IN THE FIRE - TAP loop-animation compare (dev only)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #06070d; font-family: -apple-system, "Hiragino Sans", sans-serif; color: #ccd2e6; }
  h1 { font-size: 1.0rem; font-weight: 600; margin: 0 0 8px; color: #eef1fb; }
  p.note { font-size: 0.72rem; opacity: 0.65; max-width: 900px; line-height: 1.6; margin: 0 0 10px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tabs button { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #ccd2e6; font-size: 0.72rem; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  .tabs button.active { background: rgba(150,180,255,0.22); border-color: rgba(190,210,255,0.5); color: #fff; }
  .panes { display: flex; gap: 18px; flex-wrap: wrap; }
  .pane { }
  .pane h2 { font-size: 0.78rem; margin: 0 0 6px; opacity: 0.85; }
  canvas { display: block; border-radius: 6px; background: #050608; }
  .hud { font-size: 0.66rem; opacity: 0.7; margin-top: 4px; }
</style>
</head>
<body>
<h1>DEVIL IN THE FIRE — TAPループアニメーション比較（開発用・本番未反映）</h1>
<p class="note">
  LEFT = 現行production静止PNG (assets/notes/devil-in-the-fire-tap.png、82px)。
  RIGHT = 同じ画像素材を8フレームのスプライトシートへ変換したループアニメ版（12fps、約0.67秒/loop）。
  どちらも同じ実チャートnote.time・同じ判定ライン・同じ背景で比較しています。
</p>
<div class="tabs" id="tabs"></div>
<div class="panes">
  <div class="pane">
    <h2>LEFT: 現行 静止PNG</h2>
    <canvas id="stageLeft" width="390" height="844" style="width:220px;height:475px;"></canvas>
    <div class="hud" id="hudLeft"></div>
  </div>
  <div class="pane">
    <h2>RIGHT: ループアニメ版（試作・8フレーム/12fps）</h2>
    <canvas id="stageRight" width="390" height="844" style="width:220px;height:475px;"></canvas>
    <div class="hud" id="hudRight"></div>
  </div>
</div>

<script type="module">
import { makeStage, REAL_CHART } from "./shared/stage.js";

const W = 390, H = 844;
const stageL = makeStage(W, H);
const stageR = makeStage(W, H);
const ctxL = document.getElementById("stageLeft").getContext("2d");
const ctxR = document.getElementById("stageRight").getContext("2d");

const DISPLAY_WIDTH = 82; // matches production tapImageWidthPx

// ---------- static (LEFT) ----------
const staticImg = new Image();
staticImg.src = "../assets/notes/devil-in-the-fire-tap.png";
const ANCHOR_X = 0.4857, ANCHOR_Y = 0.9588; // same measured anchor as production

function drawStatic(ctx, cx, tipY, displayWidth) {
  if (!staticImg.complete || !staticImg.naturalWidth) return;
  const scale = displayWidth / staticImg.naturalWidth;
  const dw = staticImg.naturalWidth * scale, dh = staticImg.naturalHeight * scale;
  const dx = cx - ANCHOR_X * dw, dy = tipY - ANCHOR_Y * dh;
  ctx.drawImage(staticImg, dx, dy, dw, dh);
}

// ---------- animated (RIGHT) ----------
const N_FRAMES = 12;
const FPS = 12;
const LOOP_SEC = N_FRAMES / FPS; // ~1.0s
const sheetImg = new Image();
sheetImg.src = "devil-vfx-assets/tap-anim-sheet.png";
let frameNativeW = 0, frameNativeH = 0;

function drawAnimated(ctx, cx, tipY, displayWidth, currentTime, noteTime) {
  if (!sheetImg.complete || !sheetImg.naturalWidth) return;
  if (!frameNativeW) {
    frameNativeW = sheetImg.naturalWidth / N_FRAMES;
    frameNativeH = sheetImg.naturalHeight;
  }
  // deterministic per-note phase offset (item 8): the note's OWN chart
  // time shifts its local animation clock, so simultaneous/consecutive
  // notes are not all flickering in lockstep, but the same chart always
  // reproduces the same look (no per-frame randomness).
  const localClock = currentTime + noteTime;
  const cyclePos = ((localClock / LOOP_SEC) % 1 + 1) % 1;
  const frameIndex = Math.min(N_FRAMES - 1, Math.floor(cyclePos * N_FRAMES));

  const scale = displayWidth / frameNativeW;
  const dw = frameNativeW * scale, dh = frameNativeH * scale;
  const dx = cx - ANCHOR_X * dw, dy = tipY - ANCHOR_Y * dh;
  ctx.drawImage(
    sheetImg,
    frameIndex * frameNativeW, 0, frameNativeW, frameNativeH,
    dx, dy, dw, dh
  );
}

const SCENARIOS = [
  { id: "single", label: "A. TAP単体" },
  { id: "pair", label: "B. 実0.163秒2連続" },
  { id: "triplet", label: "C. 実3連続" },
];
let rafId = null;
function stopLoop() { if (rafId) cancelAnimationFrame(rafId); rafId = null; }

function startScenario(id) {
  stopLoop();
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b.dataset.id === id));
  const t0 = performance.now();

  function loop(now) {
    if (id === "single") {
      const cycle = 2.4 * 1000, elapsed = (now - t0) % cycle;
      const ct = elapsed / 1000 - 1.8;
      const y = stageL.yForTime(0, ct);
      stageL.drawStage(ctxL, y >= stageL.judgeY - 30 ? [1] : []);
      stageR.drawStage(ctxR, y >= stageR.judgeY - 30 ? [1] : []);
      if (y > -150 && y < H + 150) {
        drawStatic(ctxL, stageL.laneCenterX(1), y, DISPLAY_WIDTH);
        drawAnimated(ctxR, stageR.laneCenterX(1), y, DISPLAY_WIDTH, now / 1000, 0);
      }
    } else if (id === "pair") {
      const { lane, times } = REAL_CHART.pair;
      const span = times[1] - times[0];
      const cycle = (1.8 + span + 0.6) * 1000, elapsed = (now - t0) % cycle;
      const ct = times[0] + (elapsed / 1000 - 1.8);
      const yA = stageL.yForTime(times[0], ct), yB = stageL.yForTime(times[1], ct);
      stageL.drawStage(ctxL, [lane]);
      stageR.drawStage(ctxR, [lane]);
      if (yA > -150 && yA < H + 150) {
        drawStatic(ctxL, stageL.laneCenterX(lane), yA, DISPLAY_WIDTH);
        drawAnimated(ctxR, stageR.laneCenterX(lane), yA, DISPLAY_WIDTH, now / 1000, times[0]);
      }
      if (yB > -150 && yB < H + 150) {
        drawStatic(ctxL, stageL.laneCenterX(lane), yB, DISPLAY_WIDTH);
        drawAnimated(ctxR, stageR.laneCenterX(lane), yB, DISPLAY_WIDTH, now / 1000, times[1]);
      }
    } else if (id === "triplet") {
      const { lane, times } = REAL_CHART.triplet;
      const span = times[2] - times[0];
      const cycle = (1.8 + span + 0.6) * 1000, elapsed = (now - t0) % cycle;
      const ct = times[0] + (elapsed / 1000 - 1.8);
      stageL.drawStage(ctxL, [lane]);
      stageR.drawStage(ctxR, [lane]);
      for (const time of times) {
        const y = stageL.yForTime(time, ct);
        if (y > -150 && y < H + 150) {
          drawStatic(ctxL, stageL.laneCenterX(lane), y, DISPLAY_WIDTH);
          drawAnimated(ctxR, stageR.laneCenterX(lane), y, DISPLAY_WIDTH, now / 1000, time);
        }
      }
    }
    rafId = requestAnimationFrame(loop);
  }
  rafId = requestAnimationFrame(loop);
}

const tabsEl = document.getElementById("tabs");
for (const s of SCENARIOS) {
  const b = document.createElement("button");
  b.textContent = s.label; b.dataset.id = s.id;
  b.addEventListener("click", () => startScenario(s.id));
  tabsEl.appendChild(b);
}
document.querySelector("#tabs button").classList.add("active");
document.getElementById("hudLeft").textContent = "静止画（アニメーションなし）";
document.getElementById("hudRight").textContent = `8フレーム / ${FPS}fps / 1ループ約${LOOP_SEC.toFixed(2)}秒`;
startScenario("single");
</script>
</body>
</html>
