<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>RHYTHM-GAME</title>
<link rel="icon" type="image/x-icon" href="assets/icons/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/icon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#060814" />
<!-- OPENING B ("Legend / Of / KIVA") title font only - Cinzel, a Roman-
     inscription/Trajan-style serif capital face, deliberately distinct from
     OPENING A's serif italic (Memories Of ALEXIA, unchanged - see
     css/style.css's .title-line rules). Loaded from Google Fonts with
     font-display:swap; if the network request fails, css/style.css's
     font-family fallback stack (Georgia/Times New Roman serif) still reads
     as a serif capital lockup rather than falling back to a sans face. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">

  <!-- Shared TITLE/menu world background - lives OUTSIDE any single
       .screen so it is never destroyed/recreated when switching between
       TITLE and the song list (both are "in the menu world"). Visibility
       is toggled by js/main.js's showScreen() based on which of those two
       screens is active; the video/element itself is created exactly once
       and never removed from the DOM. -->
  <div id="menu-bg-layer" class="menu-bg-layer active" aria-hidden="true">
    <div id="title-bg"></div>
    <video id="title-bg-video" class="title-bg-video" src="assets/video/opening-loop.mov" autoplay muted loop playsinline webkit-playsinline="true" preload="auto" disablepictureinpicture disableremoteplayback x-webkit-airplay="deny"></video>
    <div id="title-dim"></div>
  </div>

  <!-- OPENING STEP 1/2: the logo/GAME START button live OUTSIDE the video
       itself and are pure DOM/CSS - no native video controls of any kind
       are ever attached to #title-bg-video (no `controls` attribute), so
       there is nothing for iOS Safari to draw a native play button over.
       #screen-title starts WITHOUT the .step2 class (STEP 1: video + TAP
       TO START only, no logo) - js/main.js adds .step2 on the first tap,
       which is what fades the logo in and swaps the button label to GAME
       START via CSS (see .title-main / .tap-to-start rules). -->
  <section id="screen-title" class="screen active">
    <button id="btn-start" class="title-tap-target">
      <h1 class="title-main">
        <span class="title-line title-line-1">Memories</span>
        <span class="title-line title-line-2">Of</span>
        <span class="title-line title-line-3">ALEXIA</span>
      </h1>
      <span class="tap-to-start">TAP TO START</span>
    </button>

    <!-- DEV-ONLY, TEMPORARY: OPENING A/B background video comparison
         switch - see js/openingAB.js. A sibling of #btn-start (not a
         descendant), so tapping it never also triggers TAP TO START/GAME
         START. To remove this feature once a final video is chosen:
         delete this block, delete js/openingAB.js, delete its import +
         one setupOpeningAB(...) call in js/main.js, delete the
         ".opening-ab-*" rules in css/style.css. -->
    <div id="opening-ab-switch" class="opening-ab-switch">
      <button type="button" class="opening-ab-btn" data-opening="A">OPENING A</button>
      <button type="button" class="opening-ab-btn" data-opening="B">OPENING B</button>
    </div>
  </section>

  <!-- Loading overlay for the OPENING background video only - shown just
       long enough to cover a slow initial load (see js/main.js's
       watchOpeningVideoLoading()), never a fixed timer. Progress is
       derived only from real signals the video element exposes
       (readyState tiers + video.buffered vs video.duration); it never
       claims 100% before the video has actually confirmed it can render a
       frame. -->
  <div id="title-loading-overlay" class="hidden" aria-hidden="true">
    <div class="title-loading-panel">
      <div class="title-loading-label">Loading...</div>
      <div class="title-loading-bar-track">
        <div id="title-loading-bar-fill" class="title-loading-bar-fill"></div>
      </div>
      <div id="title-loading-pct" class="title-loading-pct">0%</div>
    </div>
  </div>

  <section id="screen-songlist" class="screen">
    <div id="songlist-bg" aria-hidden="true"></div>
    <div class="veil-panel songlist-panel">
      <h2 class="songlist-title">SELECT SONG</h2>
      <div id="songlist-items"></div>
      <button id="btn-songlist-back" class="btn-text">戻る</button>
    </div>
  </section>

  <section id="screen-select" class="screen">
    <div id="select-bg" aria-hidden="true"></div>
    <div class="veil-panel select-panel">
      <div class="difficulty-buttons">
        <button class="btn-diff" data-diff="EASY">EASY</button>
        <button class="btn-diff" data-diff="NORMAL">NORMAL</button>
        <button class="btn-diff" data-diff="HARD">HARD</button>
      </div>
      <button id="btn-back-title" class="btn-text">戻る</button>
    </div>
  </section>

  <section id="screen-play" class="screen">
    <div id="bg-layer">
      <video id="bg-video" muted playsinline webkit-playsinline="true" preload="auto" loop></video>
      <div id="bg-fallback"></div>
      <div id="bg-dim"></div>
    </div>

    <div id="lanes-overlay">
      <div class="lane" data-lane="0"></div>
      <div class="lane" data-lane="1"></div>
      <div class="lane" data-lane="2"></div>
      <div class="lane" data-lane="3"></div>
    </div>

    <canvas id="notes-canvas"></canvas>

    <div id="judge-pads">
      <div class="judge-pad" data-lane="0"><span class="pad-ripple"></span></div>
      <div class="judge-pad" data-lane="1"><span class="pad-ripple"></span></div>
      <div class="judge-pad" data-lane="2"><span class="pad-ripple"></span></div>
      <div class="judge-pad" data-lane="3"><span class="pad-ripple"></span></div>
    </div>

    <div id="touch-zones">
      <div class="touch-zone" data-lane="0"></div>
      <div class="touch-zone" data-lane="1"></div>
      <div class="touch-zone" data-lane="2"></div>
      <div class="touch-zone" data-lane="3"></div>
    </div>

    <div id="hud">
      <div id="hud-left">
        <span class="hud-label">SCORE</span>
        <div id="hud-score">0</div>
        <div id="hud-combo-wrap">
          <span class="hud-label">COMBO</span>
          <div id="hud-combo"></div>
        </div>
      </div>
      <!-- Momentary PERFECT/GREAT/GOOD/MISS feedback - centered across the
           4 lanes, just above the judge line, so it lands right where the
           player's eyes already are while playing (see js/main.js's
           showJudgePopup(), unchanged - only this element's position
           moved out of the top-left SCORE/COMBO column). -->
      <div id="hud-judge"></div>
      <button id="btn-pause" class="btn-icon">II</button>
      <div id="hud-progress"><div id="hud-progress-bar"></div></div>
    </div>

    <!-- DEV-ONLY, TEMPORARY: nijiiro-eden-2 background-crop comparison
         switch. Shown only while that one song is playing (see
         js/main.js's setupNijiiroBgSwitch()) - lets the crop candidates
         (A/B/C) be swapped live on a real device instead of guessing a
         final value blind. Remove this block + its CSS + its JS once a
         candidate is chosen (see the request this implements). -->
    <div id="nijiiro-bg-switch" class="nijiiro-bg-switch hidden">
      <span class="nijiiro-bg-label">NIJIIRO BG</span>
      <button type="button" class="opening-ab-btn" data-bg="A">A</button>
      <button type="button" class="opening-ab-btn" data-bg="B">B</button>
      <button type="button" class="opening-ab-btn" data-bg="C">C</button>
    </div>

    <div id="pause-overlay" class="overlay hidden">
      <div class="veil-panel overlay-panel">
        <h3>PAUSE</h3>
        <button id="btn-resume" class="btn-veil">つづける</button>
        <button id="btn-quit" class="btn-text">やめる</button>
      </div>
    </div>

    <!-- Shared "BLACKOUT -> 3 -> 2 -> 1 -> GAME START" pre-game countdown,
         common to every song (see js/main.js's runCountdown()/
         beginPlayTransition()) - opaque, covers bg/lanes/HUD/notes
         entirely, never a per-song element. #countdown-ready is the
         optional, deliberately quiet "still loading" indicator shown only
         if the background genuinely takes a while past the count. -->
    <div id="countdown-overlay" class="countdown-overlay hidden">
      <div id="countdown-number" class="countdown-number"></div>
      <div id="countdown-ready" class="countdown-ready hidden">READY...</div>
    </div>
  </section>

  <!-- preload="none": this must not compete with the TITLE video for
       bandwidth/decode resources at page load - it only ever needs to be
       ready by the time the user's first real gesture (TAP TO START)
       calls .play() on it, which is more than enough lead time. -->
  <audio id="title-bgm" src="assets/audio/title-bgm.mp3" loop preload="none" playsinline webkit-playsinline="true"></audio>

  <div id="landscape-overlay" class="overlay hidden">
    <div class="veil-panel overlay-panel landscape-panel">
      <div class="landscape-icon" aria-hidden="true"></div>
      <h3>PLEASE ROTATE YOUR DEVICE</h3>
      <p>このアプリは縦画面専用です。<br />端末を縦向きに戻してください。</p>
    </div>
  </div>

  <div id="audio-error-overlay" class="overlay hidden">
    <div class="veil-panel overlay-panel error-panel">
      <h3>AUDIO LOAD ERROR</h3>
      <p id="audio-error-detail"></p>
      <button id="btn-audio-error-back" class="btn-text">曲選択へ戻る</button>
    </div>
  </div>

  <section id="screen-result" class="screen">
    <div class="veil-panel result-panel">
      <h2>RESULT</h2>
      <div id="result-rank"></div>
      <div id="result-score-wrap">
        <span>SCORE</span>
        <div id="result-score">0</div>
      </div>
      <div id="result-stats">
        <div class="stat"><span class="label">MAX COMBO</span><span id="result-maxcombo" class="value"></span></div>
        <div class="stat perfect"><span class="label">PERFECT</span><span id="result-perfect" class="value"></span></div>
        <div class="stat great"><span class="label">GREAT</span><span id="result-great" class="value"></span></div>
        <div class="stat good"><span class="label">GOOD</span><span id="result-good" class="value"></span></div>
        <div class="stat miss"><span class="label">MISS</span><span id="result-miss" class="value"></span></div>
      </div>
      <p id="result-thanks">Thank you for playing!!</p>
      <a id="btn-artist-page" class="btn-artist-page hidden" href="#" target="_blank" rel="noopener noreferrer">
        <span>ARTIST PAGE</span>
      </a>

      <div class="result-buttons">
        <button id="btn-retry" class="btn-veil">RETRY</button>
        <button id="btn-to-select" class="btn-text">曲選択へ</button>
      </div>
    </div>
  </section>

</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
